<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценки по дисциплинам</title>
</head>
<body>
    <h1>Оценки по дисциплинам</h1>
    <form method="post" action="/">
        <p>
            <label>Дисциплина: <input name="subject" required></label>
        </p>
        <p>
            <label>Оценка:
                <select name="grade">
                    <option>5</option>
                    <option>4</option>
                    <option>3</option>
                    <option>2</option>
                </select>
            </label>
        </p>
        <button type="submit">Добавить</button>
    </form>

    <h2>Добавленные оценки</h2>
    <table border="1" cellpadding="8">
        <tr><th>Дисциплина</th><th>Оценки</th></tr>
        <!-- GRADES -->
    </table>
    <p>Оценки хранятся до остановки сервера.</p>
</body>
</html>
